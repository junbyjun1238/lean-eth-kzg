name: Search Dedup Witness

on:
  workflow_dispatch:
    inputs:
      max_donors:
        description: Maximum donor entries to consider
        required: false
        default: "256"
      max_candidates:
        description: Maximum candidate mutations to evaluate
        required: false
        default: "2048"
      max_differentials:
        description: Maximum differentials to persist
        required: false
        default: "32"
      synthetic_seed_limit:
        description: Maximum synthetic bug-shape seeds to derive
        required: false
        default: "128"

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: python -m pip install PyYAML

      - name: Fetch pinned c-kzg-4844 tags
        run: python scripts/fetch_c_kzg_tags.py --tag v2.1.4 --tag v2.1.5

      - name: Fetch consensus-spec-tests beta fixtures
        run: git clone --depth 1 --branch v1.6.0-beta.0 https://github.com/ethereum/consensus-spec-tests .tmp/consensus-spec-tests-v1.6.0-beta.0

      - name: Search dedup differential candidates
        run: >
          python scripts/search_dedup_differentials.py
          --max-donors "${{ inputs.max_donors }}"
          --max-candidates "${{ inputs.max_candidates }}"
          --max-differentials "${{ inputs.max_differentials }}"
          --synthetic-seed-limit "${{ inputs.synthetic_seed_limit }}"

      - name: Upload search artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedup-search-artifacts
          path: |
            artifacts/dedup-search-report.json
            artifacts/dedup-search-candidates
